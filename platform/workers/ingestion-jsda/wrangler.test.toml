name = "quant-platform-ingestion-jsda-test"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[[r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "quant-raw-jsda-test"

[[d1_databases]]
binding = "DB"
database_name = "quant-ingest-jsda-test"
database_id = "00000000-0000-0000-0000-000000000011"
migrations_dir = "../ingestion-premium/migrations"

[[queues.producers]]
binding = "JSDA_QUEUE"
queue = "quant-jsda-ingestion-test"

[[queues.consumers]]
queue = "quant-jsda-ingestion-test"
max_batch_size = 3
max_batch_timeout = 5
max_retries = 3
retry_delay = 60
dead_letter_queue = "quant-jsda-ingestion-dlq-test"
max_concurrency = 1

[[queues.consumers]]
queue = "quant-jsda-ingestion-dlq-test"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 8
retry_delay = 60
dead_letter_queue = "quant-jsda-ingestion-rejects-test"
max_concurrency = 1

[vars]
USER_AGENT = "quant-platform-jsda-runtime-test/0.1"
INGESTION_RUN_TOKEN = "jsda-runtime-test-token"
JSDA_DLQ_QUEUE = "quant-jsda-ingestion-dlq-test"
