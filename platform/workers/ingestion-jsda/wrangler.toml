# JSDA governed sources — public HTTP, no API key.
# Raw artifacts land in R2; structured parse remains Python (xlrd/openpyxl)
# until a Workers-native structured path is added.
#
# Public surface: none. Cron/internal only. Not a public ingest API.
# workers_dev=false: no stable *.workers.dev hostname.
# preview_urls=false: version preview URLs are not a product surface
# (wrangler 4.125.0 supports preview_urls).
# Staging is not [env.staging] in this file. See wrangler.staging.toml for
# distinct staging-only D1, R2, Queue, and Worker resources.
name = "quant-platform-ingestion-jsda"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[secrets]
required = ["INGESTION_RUN_TOKEN"]

[[r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "quant-raw"

[[d1_databases]]
binding = "DB"
database_name = "quant-ingest"
database_id = "be6fdcf8-40be-41fc-9535-7facd1fc2ffc"

[[services]]
binding = "RECEIPT_EVIDENCE_AUTHORITY"
service = "quant-platform-receipt-evidence-authority"
entrypoint = "ReceiptAuthorityService"

[[queues.producers]]
binding = "JSDA_QUEUE"
queue = "quant-jsda-ingestion"

[[queues.consumers]]
queue = "quant-jsda-ingestion"
max_batch_size = 3
max_batch_timeout = 5
max_retries = 3
retry_delay = 60
dead_letter_queue = "quant-jsda-ingestion-dlq"
max_concurrency = 1

[[queues.consumers]]
queue = "quant-jsda-ingestion-dlq"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 8
retry_delay = 60
dead_letter_queue = "quant-jsda-ingestion-rejects"
max_concurrency = 1

# Required secret:
#   INGESTION_RUN_TOKEN — gates /v1/run (reuse premium run token recommended)

[vars]
USER_AGENT = "quant-platform-ingest/0.1 (+personal-research; JSDA bond stats)"
JSDA_DLQ_QUEUE = "quant-jsda-ingestion-dlq"
RECEIPT_AUTHORITY_ENVIRONMENT = "production"
RECEIPT_AUTHORITY_OPERATION_MODE = "PENDING"

[triggers]
# Daily 01:30 UTC == 10:30 JST — after typical JSDA morning publication window.
crons = ["30 1 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[env.production]
name = "quant-platform-ingestion-jsda"
workers_dev = false
preview_urls = false

[env.production.secrets]
required = ["INGESTION_RUN_TOKEN"]

[[env.production.r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "quant-raw"

[[env.production.d1_databases]]
binding = "DB"
database_name = "quant-ingest"
database_id = "be6fdcf8-40be-41fc-9535-7facd1fc2ffc"

[[env.production.services]]
binding = "RECEIPT_EVIDENCE_AUTHORITY"
service = "quant-platform-receipt-evidence-authority"
entrypoint = "ReceiptAuthorityService"

# Queue bindings are non-inheritable and must be repeated for named environments.
[[env.production.queues.producers]]
binding = "JSDA_QUEUE"
queue = "quant-jsda-ingestion"

[[env.production.queues.consumers]]
queue = "quant-jsda-ingestion"
max_batch_size = 3
max_batch_timeout = 5
max_retries = 3
retry_delay = 60
dead_letter_queue = "quant-jsda-ingestion-dlq"
max_concurrency = 1

[[env.production.queues.consumers]]
queue = "quant-jsda-ingestion-dlq"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 8
retry_delay = 60
dead_letter_queue = "quant-jsda-ingestion-rejects"
max_concurrency = 1

[env.production.vars]
USER_AGENT = "quant-platform-ingest/0.1 (+personal-research; JSDA bond stats)"
JSDA_DLQ_QUEUE = "quant-jsda-ingestion-dlq"
RECEIPT_AUTHORITY_ENVIRONMENT = "production"
RECEIPT_AUTHORITY_OPERATION_MODE = "PENDING"

[env.production.triggers]
# Named environments do not inherit top-level triggers.
crons = ["30 1 * * *"]

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"
