# JSDA governed sources — public HTTP, no API key.
# Raw artifacts land in R2; structured parse remains Python (xlrd/openpyxl)
# until a Workers-native structured path is added.
#
# Public surface: cron/internal. Production has no workers.dev hostname.
# preview_urls are version-only, not a public ingest API.
name = "quant-platform-ingestion-jsda"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = true

[[r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "quant-raw"

[[d1_databases]]
binding = "DB"
database_name = "quant-ingest"
database_id = "be6fdcf8-40be-41fc-9535-7facd1fc2ffc"

# Secrets (optional):
#   INGESTION_RUN_TOKEN — gates /v1/run (reuse premium run token recommended)

[vars]
USER_AGENT = "quant-platform-ingest/0.1 (+personal-research; JSDA bond stats)"
# Cap data-file downloads per discovery run (0 = unlimited). Use 1 for min-segment evidence.
MAX_DATA_FILES = "3"
MAX_YEAR_PAGES = "1"

[triggers]
# Daily 01:30 UTC == 10:30 JST — after typical JSDA morning publication window.
crons = ["30 1 * * *"]

[observability]
enabled = true

[env.production]
name = "quant-platform-ingestion-jsda"
workers_dev = false
preview_urls = true

[[env.production.r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "quant-raw"

[[env.production.d1_databases]]
binding = "DB"
database_name = "quant-ingest"
database_id = "be6fdcf8-40be-41fc-9535-7facd1fc2ffc"

[env.production.vars]
USER_AGENT = "quant-platform-ingest/0.1 (+personal-research; JSDA bond stats)"
MAX_DATA_FILES = "3"
MAX_YEAR_PAGES = "1"
