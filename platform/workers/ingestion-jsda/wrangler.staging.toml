# Staging uses distinct resources and carries no production secrets.

name = "quant-platform-ingestion-jsda-staging"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[[queues.producers]]
binding = "JSDA_QUEUE"
queue = "quant-jsda-ingestion-staging"

[[queues.consumers]]
queue = "quant-jsda-ingestion-staging"
max_batch_size = 3
max_batch_timeout = 5
max_retries = 3
retry_delay = 60
dead_letter_queue = "quant-jsda-ingestion-dlq-staging"
max_concurrency = 1

[[queues.consumers]]
queue = "quant-jsda-ingestion-dlq-staging"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 8
retry_delay = 60
dead_letter_queue = "quant-jsda-ingestion-rejects-staging"
max_concurrency = 1

[[r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "quant-raw-staging"

[[d1_databases]]
binding = "DB"
database_name = "quant-ingest-staging"
database_id = "d448d1c6-27c8-4aeb-8702-3e7a8b6bf2bb"

[[services]]
binding = "RECEIPT_EVIDENCE_AUTHORITY"
service = "quant-platform-receipt-evidence-authority-staging"
entrypoint = "ReceiptAuthorityService"

[vars]
USER_AGENT = "quant-platform-staging-ingest/0.1"
JSDA_DLQ_QUEUE = "quant-jsda-ingestion-dlq-staging"
RECEIPT_AUTHORITY_ENVIRONMENT = "staging"
RECEIPT_AUTHORITY_OPERATION_MODE = "PENDING"

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"
