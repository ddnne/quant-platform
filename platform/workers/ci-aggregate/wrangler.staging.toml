# Private staging CI sentinel. The caller-supplied receipt endpoint is
# deprecated and has no public route; this Worker only supplies a non-product
# script identity for native Workers Builds until ci-aggregate is removed.

name = "quant-platform-ci-aggregate-staging"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[vars]
GITHUB_REPOSITORY = "ddnne/quant-platform"
GITHUB_STATUS_CONTEXT = "ci-aggregate-staging"

# No production secrets are copied. Unbound secrets keep the legacy endpoint
# fail-closed even if a route is added accidentally.
