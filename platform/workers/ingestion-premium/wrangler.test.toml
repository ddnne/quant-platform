name = "quant-platform-ingestion-premium-test"
main = "runtime/receipt_audit_rpc_harness.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[vars]
RECEIPT_AUTHORITY_ENVIRONMENT = "staging"
RECEIPT_AUTHORITY_OPERATION_MODE = "ACTIVE"

[[d1_databases]]
binding = "DB"
database_name = "quant-ingest-premium-audit-test"
database_id = "00000000-0000-0000-0000-000000000019"

[[services]]
binding = "AUDIT_ONLY"
service = "quant-platform-ingestion-premium-test"
entrypoint = "PremiumReceiptAuditEvidenceService"

[version_metadata]
binding = "CF_VERSION_METADATA"
