# Phase 3.5 — J-Quants Premium **core** ingestion closed loop.
#
# Resources (Cloudflare, billed):
#   * R2 bucket ``quant-raw``        — verbatim source JSON per fetch
#   * R2 bucket ``quant-structured`` — (reserved; structured rows live in D1)
#   * D1 database ``quant-ingest``   — PIT-shaped structured rows
#
# Bindings (set up once via `wrangler`):
#   npx wrangler r2 bucket create quant-raw
#   npx wrangler r2 bucket create quant-structured
#   npx wrangler d1 create quant-ingest
#   # apply migrations:
#   npx wrangler d1 execute quant-ingest --file=migrations/0001_init.sql
#
# Secrets (set on this worker, values NOT in this file):
#   npx wrangler secret put JQUANTS_API_KEY -c platform/workers/ingestion-premium/wrangler.toml
#   npx wrangler secret put INGESTION_RUN_TOKEN -c platform/workers/ingestion-premium/wrangler.toml
#   npx wrangler secret put DATA_EXPORT_TOKEN -c platform/workers/ingestion-premium/wrangler.toml
#
# Cron: hourly at :15 (Premium endpoints publish continuously through the JST
# trading day). Worker paces upstream at ~120 ms (500/min). Override concurrency
# via [vars].INGEST_CONCURRENCY (default 6, max 8).
#
# Public surface: none. Cron/internal only. Not a public ingest API.
# workers_dev=false: no stable *.workers.dev hostname.
# preview_urls=false: version preview URLs are not a product surface
# (wrangler 4.125.0 supports preview_urls).
# Staging is not [env.staging] in this file (would share the production
# Cloudflare account). See wrangler.staging.toml — HUMAN separate account.

name = "quant-platform-ingestion-premium"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[secrets]
required = ["DATA_EXPORT_TOKEN", "INGESTION_RUN_TOKEN", "JQUANTS_API_KEY"]

# R2 — full response pages + manifest under raw/{dataset}/{run_id}/.
[[r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "quant-raw"

# R2 — high-volume structured JSONL/Parquet partitions (historical SoT).
# D1 holds control-plane + hot-window only; see write_path_config.ts.
[[r2_buckets]]
binding = "STRUCTURED_BUCKET"
bucket_name = "quant-structured"

# D1 — control plane + low-volume / hot-window structured (not full history).
[[d1_databases]]
binding = "DB"
database_name = "quant-ingest"
database_id = "be6fdcf8-40be-41fc-9535-7facd1fc2ffc"

[[services]]
binding = "RECEIPT_EVIDENCE_AUTHORITY"
service = "quant-platform-receipt-evidence-authority"
entrypoint = "ReceiptAuthorityService"

# Secrets bound via `wrangler secret put` (never in this file):
# - JQUANTS_API_KEY            (required for fetch)
# - INGESTION_RUN_TOKEN        (manual run and migration rebuild only)
# - DATA_EXPORT_TOKEN          (structured export endpoints only)

[vars]
# Parallel dataset ingest; shared RateLimiter still enforces ~500/min upstream.
INGEST_CONCURRENCY = "6"
RECEIPT_AUTHORITY_ENVIRONMENT = "production"
RECEIPT_AUTHORITY_OPERATION_MODE = "PENDING"
# MASTER_SCD2_ONLY = "1"  # optional: route equities_master structured to R2 only

[triggers]
# Hourly at :15. Workers Cron is UTC; for example 00:15 UTC == 09:15 JST.
crons = ["15 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[env.production]
name = "quant-platform-ingestion-premium"
workers_dev = false
preview_urls = false

[env.production.secrets]
required = ["DATA_EXPORT_TOKEN", "INGESTION_RUN_TOKEN", "JQUANTS_API_KEY"]

[[env.production.r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "quant-raw"

[[env.production.r2_buckets]]
binding = "STRUCTURED_BUCKET"
bucket_name = "quant-structured"

[[env.production.d1_databases]]
binding = "DB"
database_name = "quant-ingest"
database_id = "be6fdcf8-40be-41fc-9535-7facd1fc2ffc"

[[env.production.services]]
binding = "RECEIPT_EVIDENCE_AUTHORITY"
service = "quant-platform-receipt-evidence-authority"
entrypoint = "ReceiptAuthorityService"

[env.production.vars]
INGEST_CONCURRENCY = "6"
RECEIPT_AUTHORITY_ENVIRONMENT = "production"
RECEIPT_AUTHORITY_OPERATION_MODE = "PENDING"

[env.production.triggers]
# Named environments do not inherit top-level triggers.
crons = ["15 * * * *"]

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"
