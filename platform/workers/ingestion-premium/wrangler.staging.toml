# Staging uses distinct resources and carries no production secrets.

name = "quant-platform-ingestion-premium-staging"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[secrets]
required = ["INGESTION_RUN_TOKEN", "JQUANTS_API_KEY", "OPS_PROJECTION_SIGNING_PKCS8_B64", "READY_ED25519_PRIVATE_KEY", "TRADER_ED25519_PRIVATE_KEY"]

[[r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "quant-raw-staging"

[[r2_buckets]]
binding = "STRUCTURED_BUCKET"
bucket_name = "quant-structured-staging"

[[r2_buckets]]
binding = "AUTHORITY_EVIDENCE_BUCKET"
bucket_name = "quant-receipt-evidence-staging"

[[d1_databases]]
binding = "DB"
database_name = "quant-ingest-staging"
database_id = "d448d1c6-27c8-4aeb-8702-3e7a8b6bf2bb"
migrations_dir = "migrations"
migrations_table = "d1_migrations_ingestion"

[[d1_databases]]
binding = "OPS_PROJECTION_DB"
database_name = "quant-ops-projection-staging"
database_id = "68ee96d5-766c-4832-836b-54c079bd6265"
migrations_dir = "../quant-ops-mcp/migrations/projection"
migrations_table = "d1_migrations_ops_projection"

[[services]]
binding = "RECEIPT_EVIDENCE_AUTHORITY"
service = "quant-platform-receipt-evidence-authority-staging"
entrypoint = "ReceiptAuthorityService"

[vars]
INGEST_CONCURRENCY = "2"
RECEIPT_AUTHORITY_ENVIRONMENT = "staging"
RECEIPT_AUTHORITY_OPERATION_MODE = "ACTIVE"
RECEIPT_AUTHORITY_ACTIVE_KEY_ID = "receipt-staging-98fa0160de908051"
RECEIPT_AUTHORITY_REGISTRY_DIGEST = "sha256:8e69c9165619301b02c841215ccda639ab587936ecc222c6403ffe2838a7fe77"
OPS_PROJECTION_ENVIRONMENT = "staging"
OPS_PROJECTION_SIGNING_KEY_ID = "ops-projection-staging-20260923-v1"
OPS_PROJECTION_VERIFY_SPKI_B64 = "MCowBQYDK2VwAyEASmRA/RpPa07NPKwbQq+aK/O0WE/3xmO1JKZ24W4ppqg="
READY_ED25519_KEY_ID = "ready-staging-20260923-v1"
READY_DECLARED = "false"
# Public verification material only. Provision matching staging secrets before
# ordered rollout; READY_DECLARED stays false. Deploy Premium before MCP.

[triggers]
# Minute tick; absent/invalid control stays inactive (no 24-dataset ingest).
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"
