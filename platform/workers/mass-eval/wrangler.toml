# W90 / w0816y — multi-logic × multi-period mass eval (research only).
# Lite shard on CF; heavy multi-year remains local for promising survivors.
# Does NOT arm Mass / READY / operational GO / continuous paper / live.

name = "quant-platform-mass-eval"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# R2 — research artifacts under research/mass_factory/job={id}/…
[[r2_buckets]]
binding = "STRUCTURED_BUCKET"
bucket_name = "quant-structured"

# D1 — hot tip bars for lite multi-period panels
[[d1_databases]]
binding = "DB"
database_name = "quant-ingest"
database_id = "be6fdcf8-40be-41fc-9535-7facd1fc2ffc"

# Optional Workers AI (strong open-weight; hyp gen prefers xAI from driver)
[ai]
binding = "AI"

[vars]
# Research freezes (must stay closed)
MASS_RESEARCH = "NO-GO"
PHASE7 = "OFF"
READY_DECLARED = "false"
OPERATIONAL_GO = "false"
CONTINUOUS_PAPER = "UNARMED"
WAVE = "W90 / w0816y"
VERSION = "cf-mass-eval-job/v1"
# Default lite shard caps
DEFAULT_MAX_CODES = "15"
DEFAULT_MAX_DAYS = "60"

# secrets (wrangler secret put):
#   RESEARCH_RUN_TOKEN  — gates POST /v1/research/mass_eval
#   (or reuse INGESTION_RUN_TOKEN via secret alias)

[observability]
enabled = true
