# Research multi-logic mass-eval on Cloudflare Workers (period-net screen).
#
# Purpose: batch-evaluate distinct economic logics with multi-period metrics
# on real COMPLETE-backed panels (mode=r2_panels) or D1 tip (mode=d1_bars);
# write research artifacts to R2 quant-structured.
#
# Freezes (held):
#   * operational Mass / READY / GO  — NOT armed
#   * continuous paper               — UNARMED
#   * 3 default-path representatives — not retuned
#   * no live orders
#
# Resources:
#   * R2 bucket quant-structured — research/mass_eval/job={id}/…
#   * D1 quant-ingest (optional) — tip extract for mode=d1_bars
#
# Secrets (optional):
#   npx wrangler secret put MASS_EVAL_TOKEN -c platform/workers/research-mass-eval/wrangler.toml
#
# Deploy:
#   cd platform/workers/research-mass-eval && npm install && npx wrangler deploy

name = "quant-platform-research-mass-eval"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# R2 — research mass-eval artifacts (and optional staged panels).
[[r2_buckets]]
binding = "STRUCTURED_BUCKET"
bucket_name = "quant-structured"

# D1 — hot tip structured (mode=d1_bars only; multi-year history stays R2 panels).
[[d1_databases]]
binding = "DB"
database_name = "quant-ingest"
database_id = "be6fdcf8-40be-41fc-9535-7facd1fc2ffc"

# Workers AI — propose-thesis only. Never auto-injects catalog.
[ai]
binding = "AI"

[vars]
MASS_EVAL_VERSION = "research-mass-eval/v39-good-unique"
MASS_EVAL_WAVE = "research-mass-eval"
# Freezes — do not flip operational gates from this worker.
MASS_RESEARCH = "NO-GO"
PHASE7 = "OFF"
READY_DECLARED = "false"
OPERATIONAL_GO = "false"
CONTINUOUS_PAPER = "UNARMED"

[observability]
enabled = true
