# Research multi-logic mass-eval on Cloudflare Workers (period-net screen).
#
# Purpose: batch-evaluate distinct economic logics with multi-period metrics
# on immutable, readiness-bound R2 panels (mode=r2_panels);
# write research artifacts to R2 quant-structured.
#
# Freezes (held):
#   * operational Mass / READY / GO  — NOT armed
#   * continuous paper               — UNARMED
#   * 3 default-path representatives — not retuned
#   * no live orders
#
# Resources:
#   * R2 bucket quant-structured — research/mass_eval/job={id}/…
#
# Secrets (required for eval/propose; unbound token fail-closes authorized()):
#   npx wrangler secret put MASS_EVAL_TOKEN -c platform/workers/research-mass-eval/wrangler.toml
#
# Deploy:
#   cd platform/workers/research-mass-eval && npm install && npx wrangler deploy --env production
#
# Public surface: token-gated workers.dev for the personal DRAFT Container.
# Existing Mass/Phase7 routes remain capability-gated NO-GO/OFF.
# preview_urls=false: version preview URLs are not a research API
# (wrangler 4.125.0 supports preview_urls).
# Staging is not [env.staging] in this file (would share the production
# Cloudflare account). See wrangler.staging.toml — HUMAN separate account.
# Do not bind Workers AI here; propose uses service binding AI_GATEWAY.

name = "quant-platform-research-mass-eval"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

[[containers]]
class_name = "PersonalResearchContainer"
image = "./Dockerfile"
image_build_context = "../../.."
max_instances = 1
instance_type = "standard-2"
rollout_active_grace_period = 11400

[[durable_objects.bindings]]
name = "PERSONAL_RESEARCH_CONTAINER"
class_name = "PersonalResearchContainer"

[[migrations]]
tag = "personal-research-container-v1"
new_sqlite_classes = ["PersonalResearchContainer"]

[secrets]
required = ["MASS_EVAL_TOKEN"]

# R2 — research mass-eval artifacts (and optional staged panels).
[[r2_buckets]]
binding = "STRUCTURED_BUCKET"
bucket_name = "quant-structured"

# Propose-thesis goes through AI Gateway. This worker must not bind Workers AI.
[[services]]
binding = "AI_GATEWAY"
service = "quant-platform-research-ai-gateway"
entrypoint = "GatewayService"

[vars]
MASS_EVAL_VERSION = "research-mass-eval/v144-personal-topix-svi-complete-book"
MASS_EVAL_WAVE = "research-mass-eval"
# Freezes — do not flip operational gates from this worker.
MASS_RESEARCH = "NO-GO"
PHASE7 = "OFF"
READY_DECLARED = "false"
OPERATIONAL_GO = "false"
CONTINUOUS_PAPER = "UNARMED"
# nets_only remains deny unless explicitly "allow" (and mass_screen).
NETS_ONLY = "deny"

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[env.production]
name = "quant-platform-research-mass-eval"
workers_dev = true
preview_urls = false

[[env.production.containers]]
class_name = "PersonalResearchContainer"
image = "./Dockerfile"
image_build_context = "../../.."
max_instances = 1
instance_type = "standard-2"
rollout_active_grace_period = 11400

[[env.production.durable_objects.bindings]]
name = "PERSONAL_RESEARCH_CONTAINER"
class_name = "PersonalResearchContainer"

[env.production.secrets]
required = ["MASS_EVAL_TOKEN"]

[[env.production.r2_buckets]]
binding = "STRUCTURED_BUCKET"
bucket_name = "quant-structured"

[[env.production.services]]
binding = "AI_GATEWAY"
service = "quant-platform-research-ai-gateway"
entrypoint = "GatewayService"

[env.production.vars]
MASS_EVAL_VERSION = "research-mass-eval/v144-personal-topix-svi-complete-book"
MASS_EVAL_WAVE = "research-mass-eval"
MASS_RESEARCH = "NO-GO"
PHASE7 = "OFF"
READY_DECLARED = "false"
OPERATIONAL_GO = "false"
CONTINUOUS_PAPER = "UNARMED"
NETS_ONLY = "deny"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"
