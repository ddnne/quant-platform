# Staging uses a distinct R2 resource and the staging AI gateway Service Binding.
# Public surface: token-gated workers.dev hostname only. No custom domain.
# Existing HTTP authorization remains fail-closed (header token; no query token).
# preview_urls=false: version preview URLs are not a research API.
# Freeze vars stay NO-GO / OFF / false.
#
# Secrets (required for eval/propose; unbound token fail-closes authorized()):
#   npx wrangler secret put MASS_EVAL_TOKEN -c platform/workers/research-mass-eval/wrangler.staging.toml

name = "quant-platform-research-mass-eval-staging"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

[secrets]
required = ["MASS_EVAL_TOKEN"]

[[containers]]
class_name = "PersonalResearchContainer"
image = "./Dockerfile"
image_build_context = "../../.."
max_instances = 8
instance_type = "standard-4"
rollout_active_grace_period = 11400

[[durable_objects.bindings]]
name = "PERSONAL_RESEARCH_CONTAINER"
class_name = "PersonalResearchContainer"

[[migrations]]
tag = "personal-research-container-v1"
new_sqlite_classes = ["PersonalResearchContainer"]

[vars]
ENVIRONMENT = "staging"
MASS_EVAL_VERSION = "research-mass-eval/v155-compact-v8-cloud-history"
MASS_EVAL_WAVE = "research-mass-eval"
MASS_RESEARCH = "NO-GO"
PHASE7 = "OFF"
READY_DECLARED = "false"
OPERATIONAL_GO = "false"
CONTINUOUS_PAPER = "UNARMED"
NETS_ONLY = "deny"

[[r2_buckets]]
binding = "STRUCTURED_BUCKET"
bucket_name = "quant-structured-staging"

[[services]]
binding = "AI_GATEWAY"
service = "quant-platform-research-ai-gateway-staging"
entrypoint = "GatewayService"

[[services]]
binding = "JQUANTS_ACQUISITION"
service = "quant-platform-ingestion-secrets-staging"
entrypoint = "IngestionSecretsService"

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"
