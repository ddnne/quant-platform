# Staging uses distinct D1/R2 resources and the private staging gateway.
# Freeze vars stay NO-GO / OFF / false.

name = "quant-platform-research-mass-eval-staging"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[vars]
MASS_RESEARCH = "NO-GO"
PHASE7 = "OFF"
READY_DECLARED = "false"
OPERATIONAL_GO = "false"
CONTINUOUS_PAPER = "UNARMED"
NETS_ONLY = "deny"

[[r2_buckets]]
binding = "STRUCTURED_BUCKET"
bucket_name = "quant-structured-staging"

[[d1_databases]]
binding = "DB"
database_name = "quant-ingest-staging"
database_id = "d448d1c6-27c8-4aeb-8702-3e7a8b6bf2bb"

[[services]]
binding = "AI_GATEWAY"
service = "quant-platform-research-ai-gateway-staging"
