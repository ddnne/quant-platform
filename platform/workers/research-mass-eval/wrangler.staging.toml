# Staging uses a distinct R2 resource and the private staging gateway.
# Freeze vars stay NO-GO / OFF / false.

name = "quant-platform-research-mass-eval-staging"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[[containers]]
class_name = "PersonalResearchContainer"
image = "./Dockerfile"
image_build_context = "../../.."
max_instances = 2
instance_type = "standard-4"
rollout_active_grace_period = 11400

[[durable_objects.bindings]]
name = "PERSONAL_RESEARCH_CONTAINER"
class_name = "PersonalResearchContainer"

[[migrations]]
tag = "personal-research-container-v1"
new_sqlite_classes = ["PersonalResearchContainer"]

[vars]
MASS_EVAL_VERSION = "research-mass-eval/v147-smile-transport"
MASS_EVAL_WAVE = "research-mass-eval"
MASS_RESEARCH = "NO-GO"
PHASE7 = "OFF"
READY_DECLARED = "false"
OPERATIONAL_GO = "false"
CONTINUOUS_PAPER = "UNARMED"
NETS_ONLY = "deny"

[[r2_buckets]]
binding = "STRUCTURED_BUCKET"
bucket_name = "quant-structured-staging"

[[services]]
binding = "AI_GATEWAY"
service = "quant-platform-research-ai-gateway-staging"
entrypoint = "GatewayService"

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"
