name = "quant-platform-research-mass-eval-test"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[[r2_buckets]]
binding = "STRUCTURED_BUCKET"
bucket_name = "quant-structured-test"

[[services]]
binding = "AI_GATEWAY"
service = "quant-platform-research-ai-gateway-test"
entrypoint = "GatewayService"

[vars]
MASS_EVAL_VERSION = "research-mass-eval/test"
MASS_EVAL_WAVE = "test"
MASS_RESEARCH = "NO-GO"
PHASE7 = "OFF"
READY_DECLARED = "false"
OPERATIONAL_GO = "false"
CONTINUOUS_PAPER = "UNARMED"
NETS_ONLY = "deny"
