name = "quant-platform-receipt-activation-observer"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "disabled"

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[env.production]
name = "quant-platform-receipt-activation-observer"
workers_dev = false
preview_urls = false

[env.production.vars]
ENVIRONMENT = "disabled"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

# HOLD until Access + JSDA service binding are provisioned. ENVIRONMENT stays disabled.
[[env.production.services]]
binding = "JSDA_INGESTION"
service = "quant-platform-ingestion-jsda"
entrypoint = "JsdaReadinessService"
