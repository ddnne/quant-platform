# Private staging placeholder. No production secrets are copied.

name = "quant-platform-ingestion-secrets-staging"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[secrets]
required = ["JQUANTS_API_KEY", "JQUANTS_RPC_CURSOR_HMAC_KEY"]

[vars]
ENVIRONMENT = "staging"

# No public route.  The two staging-only secrets support only the governed
# acquisition Service Binding; the legacy HTTP proxy remains disabled because
# no JQUANTS_PROXY_TOKEN is present.

[[ratelimits]]
name = "PROXY_RATE_LIMITER"
namespace_id = "63102"

[ratelimits.simple]
limit = 60
period = 60

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"
