# Private staging placeholder. No production secrets are copied.

name = "quant-platform-ingestion-secrets-staging"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "staging"

# No public route and no secret bindings until an internal service-binding
# consumer is deployed.

[[ratelimits]]
name = "PROXY_RATE_LIMITER"
namespace_id = "63102"

[ratelimits.simple]
limit = 60
period = 60

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"
