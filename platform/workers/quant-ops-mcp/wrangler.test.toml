name = "quant-platform-ops-read-mcp-test"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000000000000000000000000021"

[[d1_databases]]
binding = "OPS_PROJECTION_DB"
database_name = "quant-ops-projection-test"
database_id = "00000000-0000-0000-0000-000000000021"
migrations_dir = "migrations/projection"
migrations_table = "d1_migrations_ops_projection"

[[d1_databases]]
binding = "QUOTA_DB"
database_name = "quant-ops-quota-test"
database_id = "00000000-0000-0000-0000-000000000022"
migrations_dir = "migrations/quota"
migrations_table = "d1_migrations_ops_quota"

[durable_objects]
bindings = [{ name = "MCP_OBJECT", class_name = "QuantOpsMcpAgent" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuantOpsMcpAgent"]

[vars]
ALLOWED_LOGIN = "ddnne"
DAILY_ROW_QUOTA = "25000"
OAUTH_AUTHORIZATION_SERVER = "https://quant-platform-ops-read-mcp.test"
