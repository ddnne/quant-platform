# Staging uses distinct resources. It stays private until a separate OAuth
# application and callback are configured; no production secrets are copied.

name = "quant-platform-ops-read-mcp-staging"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "4402f398df93412ebe6774d1bc603142"

[[d1_databases]]
binding = "OPS_DB"
database_name = "quant-ingest-staging"
database_id = "d448d1c6-27c8-4aeb-8702-3e7a8b6bf2bb"
migrations_dir = "migrations"
migrations_table = "d1_migrations_ops"

[durable_objects]
bindings = [{ name = "MCP_OBJECT", class_name = "QuantOpsMcpAgent" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuantOpsMcpAgent"]

[vars]
ALLOWED_LOGIN = "ddnne"
DAILY_ROW_QUOTA = "25000"
# OAUTH_AUTHORIZATION_SERVER intentionally absent: fail closed until the
# separate staging OAuth app exists.
