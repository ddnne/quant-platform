# STAGING STUB — not a production config. Do not wrangler deploy this file
# against the production Cloudflare account.
#
# HUMAN: create a physically separate Cloudflare account, Worker name, D1,
# KV, OAuth App callback, and secrets. Do not copy production binding IDs
# into this file. Do not create those resources from this lane.
