name = "quant-platform-ops-read-mcp-staging"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ALLOWED_LOGIN = "ddnne"
DAILY_ROW_QUOTA = "25000"
# OAUTH_AUTHORIZATION_SERVER must be the staging workers.dev host after HUMAN
# creates it. Do not set the production callback URL here.

# Bindings omitted on purpose. Do not paste production KV or D1 ids.
# Do not set OAUTH_AUTHORIZATION_SERVER to the production workers.dev host.
#
# After HUMAN creates staging resources, bind only staging names/ids:
#   OAUTH_KV -> staging KV (distinct namespace)
#   OPS_DB   -> staging D1 (distinct database)
