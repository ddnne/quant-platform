# Staging is a distinct private Worker. No production secrets are copied.

name = "quant-platform-research-ai-gateway-staging"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[ai]
binding = "AI"

[durable_objects]
bindings = [{ name = "BUDGET_LEDGER", class_name = "BudgetLedger" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetLedger"]
