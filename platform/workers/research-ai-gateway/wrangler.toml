# Strict AI Gateway. Research mass-eval must not bind Workers AI directly.
#
# Public surface: none. Service binding only. Not a public research API.
# wrangler 4.125.0 still deploys with workers_dev=false (no route required).
# preview_urls=false: version preview URLs are not a research API.
# Staging is not [env.staging] in this file (would share the production
# Cloudflare account). See wrangler.staging.toml — HUMAN separate account.
#
# Mass uses the typed service-binding RPC and never receives a shared token.
# GATEWAY_TOKEN is only defense in depth if an operator later attaches a closed
# HTTP route; without it the HTTP /v1/complete surface fails closed.

name = "quant-platform-research-ai-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[secrets]
required = ["GATEWAY_TOKEN"]

[ai]
binding = "AI"

[durable_objects]
bindings = [{ name = "BUDGET_LEDGER", class_name = "BudgetLedger" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetLedger"]


[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[env.production]
name = "quant-platform-research-ai-gateway"
workers_dev = false
preview_urls = false

[env.production.secrets]
required = ["GATEWAY_TOKEN"]

[env.production.ai]
binding = "AI"

[env.production.durable_objects]
bindings = [{ name = "BUDGET_LEDGER", class_name = "BudgetLedger" }]

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"
