# Strict AI Gateway. Research mass-eval must not bind Workers AI directly.
#
# Public surface: service binding only. Not a public research API.
# wrangler 4.125.0 still deploys with workers_dev=false (no route required).
# Production has no workers.dev hostname. preview_urls are version-only.
#
# Secrets:
#   npx wrangler secret put GATEWAY_TOKEN -c platform/workers/research-ai-gateway/wrangler.toml
#
# Fail-closed: missing GATEWAY_TOKEN refuses /v1/complete.

name = "quant-platform-research-ai-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = true

[ai]
binding = "AI"

[durable_objects]
bindings = [{ name = "BUDGET_LEDGER", class_name = "BudgetLedger" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetLedger"]


[observability]
enabled = true

[env.production]
name = "quant-platform-research-ai-gateway"
workers_dev = false
preview_urls = true

[env.production.ai]
binding = "AI"

[env.production.durable_objects]
bindings = [{ name = "BUDGET_LEDGER", class_name = "BudgetLedger" }]
