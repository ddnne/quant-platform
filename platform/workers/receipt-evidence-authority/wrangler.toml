name = "quant-platform-receipt-evidence-authority"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[secrets]
required = ["RECEIPT_KEY_WRAP_KEY"]

[vars]
ENVIRONMENT = "production"
AUTHORITY_MODE = "PENDING"
RECEIPT_KEY_GENERATION = "1"

[[r2_buckets]]
binding = "AUTHORITY_EVIDENCE_BUCKET"
bucket_name = "quant-receipt-evidence"

[[d1_databases]]
binding = "DB"
database_name = "quant-ingest"
database_id = "be6fdcf8-40be-41fc-9535-7facd1fc2ffc"

[[durable_objects.bindings]]
name = "RECEIPT_EVIDENCE_AUTHORITY_DO"
class_name = "ReceiptEvidenceAuthority"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReceiptEvidenceAuthority"]

[[services]]
binding = "JQUANTS_ACQUISITION"
service = "quant-platform-ingestion-secrets"
entrypoint = "IngestionSecretsService"

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[env.production]
name = "quant-platform-receipt-evidence-authority"
workers_dev = false
preview_urls = false

[env.production.secrets]
required = ["RECEIPT_KEY_WRAP_KEY"]

[env.production.vars]
ENVIRONMENT = "production"
AUTHORITY_MODE = "PENDING"
RECEIPT_KEY_GENERATION = "1"

[[env.production.r2_buckets]]
binding = "AUTHORITY_EVIDENCE_BUCKET"
bucket_name = "quant-receipt-evidence"

[[env.production.d1_databases]]
binding = "DB"
database_name = "quant-ingest"
database_id = "be6fdcf8-40be-41fc-9535-7facd1fc2ffc"

[[env.production.durable_objects.bindings]]
name = "RECEIPT_EVIDENCE_AUTHORITY_DO"
class_name = "ReceiptEvidenceAuthority"

[[env.production.services]]
binding = "JQUANTS_ACQUISITION"
service = "quant-platform-ingestion-secrets"
entrypoint = "IngestionSecretsService"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"
