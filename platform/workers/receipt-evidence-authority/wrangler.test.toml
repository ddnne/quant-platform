name = "quant-platform-receipt-evidence-authority-test"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"
AUTHORITY_MODE = "ACTIVE"
ACTIVATED_KEY_ID = "receipt-test-runtime-registration-required"
RECEIPT_KEY_WRAP_KEY = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
RECEIPT_KEY_GENERATION = "1"

[[r2_buckets]]
binding = "AUTHORITY_EVIDENCE_BUCKET"
bucket_name = "quant-receipt-evidence-test"

[[d1_databases]]
binding = "DB"
database_name = "quant-ingest-receipt-test"
database_id = "00000000-0000-0000-0000-000000000014"

[[durable_objects.bindings]]
name = "RECEIPT_EVIDENCE_AUTHORITY_DO"
class_name = "ReceiptEvidenceAuthority"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReceiptEvidenceAuthority"]
