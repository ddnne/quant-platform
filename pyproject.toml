[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-platform"
version = "0.1.0"
description = "Japanese equities / disclosure / bond data research, paper, FoF platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "quant-platform" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# JSDA OTC files may be .xlsx; the authoritative Tokyo Repo Rate history is .xls.
xlsx = ["openpyxl>=3.1"]
xls = ["xlrd>=2.0.2"]
jsda = ["openpyxl>=3.1", "xlrd>=2.0.2"]
dev = [
    "pytest>=8",
    "openpyxl>=3.1",
    "xlrd>=2.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "storage*", "pit*", "core*", "features*", "strategies*", "paper_runtime*", "cf_platform*", "data_contracts*", "agents*", "risk*", "data_access*", "mcp_servers*"]
exclude = ["tests*", "scripts*", "data*", "docs*"]

[tool.setuptools]
py-modules = ["price_basis"]

[tool.setuptools.package-data]
data_contracts = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: tests that touch a real network endpoint (skipped by default; set QP_LIVE=1)",
]
