[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-platform"
version = "0.1.0"
description = "Japanese equities / disclosure / bond data research, paper, FoF platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "quant-platform" }]
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# JSDA OTC files may be .xlsx; the authoritative Tokyo Repo Rate history is .xls.
xlsx = ["openpyxl>=3.1"]
xls = ["xlrd>=2.0.2"]
jsda = ["openpyxl>=3.1", "xlrd>=2.0.2"]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8",
    "openpyxl>=3.1",
    "xlrd>=2.0.2",
]

[tool.setuptools.packages.find]
where = [
    "packages/edge",
    "packages/data_plane",
    "packages/research_runtime",
    "packages/product",
]
include = [
    "cf_platform*",
    "mcp_servers*",
    "data_contracts*",
    "ingestion*",
    "storage*",
    "pit*",
    "data_access*",
    "ops*",
    "core*",
    "features*",
    "strategies*",
    "paper_runtime*",
    "risk*",
    "price_basis*",
    "agents*",
    "research*",
    "selection*",
    "execution*",
    "knowledge*",
    "gateway*",
]
# Note: do NOT use "data*" — it would exclude data_contracts / data_access.
# Local data plane lives at repo-root data/ and is outside packages.find where=.
exclude = ["tests*", "scripts*", "docs*", "platform*"]

[tool.setuptools]
py-modules = ["qp_paths", "qp_ofd_continuity"]
# The v1 command is checkout-only; this launcher supplies the repository's
# intentional four package roots when invoked through its local environment.
script-files = ["scripts/qp-research"]

[tool.setuptools.package-data]
data_contracts = ["*.json", "source_capability_contracts/*.json"]
storage = [
    "authorities/coverage_transition/*.json",
    "authorities/receipts/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: tests that touch a real network endpoint (skipped by default; set QP_LIVE=1)",
]
