logic_id: event_funding_easy_short
family_id: event_funding_combo
family: event_sides
axis: mixed
headline: true
generation_enabled: false
promote_as_main: false
go: false
thesis: >
  If post-earnings surprise drift under easy Tokyo overnight repo is window-unstable in sign, the short side of the same skip book is the other side of that table — not evidence to kill funding.
signal_definition: >
  same PIT overnight-lt-median gate as event_funding_stress_skip; hold −surprise sign; missing overnight → skip (no ffill)
datasets:
  - fins_summary
  - jsda_tokyo_repo_rates
  - equities_bars_daily
  - markets_calendar
params:
  post_hold_days: 5
  entry_mode: same_day_close_if_pre_close
  min_hist: 20
  mode: funding_easy_short
  gate: overnight_lt_pit_trailing_median
  side: flip
  gates: easy_funding
  occupancy_equal_combo_gate: easy_funding
evaluator: research.unique_logic.dispatch.evaluate_logic_daily_mtm
