# unique22 occupancy-mismatch park: leftover Worker occupancy is not comboEventGateOk-equal. Not a candidate. Do not drop leftover body.
logic_id: surprise_xs_rank_flip
family_id: surprise_xs_rank
family: event_sides
axis: mixed
headline: true
generation_enabled: false
promote_as_main: false
go: false
thesis: >
  Relative-surprise rank is window-unstable in sign. The flipped CS book is the other side of that table, with occupancy held.
signal_definition: >
  CS rank of surprise among names whose PIT event entry is inside the last post_hold_days sessions; flip rank signs; <2 names → flat (no invent)
datasets:
  - fins_summary
  - equities_bars_daily
  - markets_calendar
params:
  post_hold_days: 5
  entry_mode: same_day_close_if_pre_close
  long_frac: 0.3
  short_frac: 0.3
  mode: surprise_xs_rank_flip
  sign_flip: True
evaluator: research.unique_logic.dispatch.evaluate_logic_daily_mtm
