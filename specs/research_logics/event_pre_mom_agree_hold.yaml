# unique22 occupancy-mismatch park: leftover Worker occupancy is not comboEventGateOk-equal. Not a candidate. Do not drop leftover body.
logic_id: event_pre_mom_agree_hold
family_id: event_mom_agree_combo
family: event_filter
axis: mixed
headline: true
generation_enabled: false
promote_as_main: false
go: false
thesis: >
  PEAD is more informative when the name was already drifting in the surprise direction. Confirm surprise-sign hold with own-name pre-entry momentum; skip disagreement and missing history.
signal_definition: >
  surprise-sign AND sign(close[entry-1]/close[entry-1-n]-1) == surprise-sign; n=5; insufficient bars or zero mom → skip
datasets:
  - fins_summary
  - equities_bars_daily
  - markets_calendar
params:
  post_hold_days: 5
  entry_mode: same_day_close_if_pre_close
  momentum_n: 5
  mode: event_pre_mom_agree_hold
  gate: own_pre_entry_mom_sign_agrees
evaluator: research.unique_logic.dispatch.evaluate_logic_daily_mtm
