logic_id: xs_margin_delta_rank
family_id: xs_margin_delta
family: cs
axis: cross_section
headline: true
generation_enabled: false
promote_as_main: false
go: false
thesis: >
  Expanding margin is crowding; shrinking margin is de-crowding. Among names with two recent PIT margin prints, long the de-crowding tail and short the crowding tail — a flow CS book, not a price CS book.
signal_definition: >
  score = −(last−prev)/|prev| from two prints with last_date < today and age<=14d; CS rank L-S of scores; <2 names or missing/stale → flatten that name / day (no ffill, no invent)
datasets:
  - markets_margin_interest
  - equities_bars_daily
  - markets_calendar
params:
  hold_days: 10
  long_frac: 0.3
  short_frac: 0.3
  stale_calendar_days: 14
  mode: xs_margin_delta_rank
  gate: name_margin_delta_cs_rank
evaluator: research.unique_logic.dispatch.evaluate_logic_daily_mtm
notes: catalog declaration; evaluate via unique_logic.dispatch
