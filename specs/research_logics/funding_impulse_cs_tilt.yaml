# unique22 occupancy-mismatch park: leftover Worker occupancy is not comboEventGateOk-equal. Not a candidate. Do not drop leftover body.
logic_id: funding_impulse_cs_tilt
family_id: funding_impulse_cs
family: cs
axis: funding
headline: true
generation_enabled: false
promote_as_main: false
go: false
thesis: >
  Large overnight funding impulses reprice relative-strength. When Tokyo repo tightens vs the prior print by at least the PIT median |Δ|, fade CS momentum; when it eases by that much, follow. Small noise moves and missing prints stay flat.
signal_definition: >
  Δovernight = overnight[d] − prior overnight print (date < d); enter iff abs(Δ) >= PIT median of abs(Δ) with delta-date < d (min_hist=20); tilt = −sign(Δ); missing/unformed/zero → flatten
datasets:
  - jsda_tokyo_repo_rates
  - equities_bars_daily
  - markets_calendar
params:
  hold_days: 10
  momentum_n: 5
  long_frac: 0.3
  short_frac: 0.3
  min_hist: 20
  mode: funding_impulse_cs_tilt
  gate: abs_overnight_delta_ge_pit_median
evaluator: research.unique_logic.dispatch.evaluate_logic_daily_mtm
