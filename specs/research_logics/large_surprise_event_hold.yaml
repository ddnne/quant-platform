logic_id: large_surprise_event_hold
family_id: large_surprise_filter
family: event_filter
axis: mixed
headline: true
generation_enabled: false
promote_as_main: false
go: false
thesis: >
  Small earnings surprises are noise. Hold the surprise sign only when |surprise| is at/above its PIT trailing median across prior universe disclosures — large-surprise PEAD, not all-event PEAD.
signal_definition: >
  earnings surprise proxy; enter iff abs(surprise) >= PIT median of abs(surprise) on events with disc_date < this disc_date (min_hist=20); median unformed → skip
datasets:
  - fins_summary
  - equities_bars_daily
  - markets_calendar
params:
  post_hold_days: 5
  entry_mode: same_day_close_if_pre_close
  min_hist: 20
  mode: large_surprise_event_hold
  gate: abs_surprise_ge_pit_trailing_median
evaluator: research.unique_logic.dispatch.evaluate_logic_daily_mtm
notes: catalog declaration; evaluate via unique_logic.dispatch
