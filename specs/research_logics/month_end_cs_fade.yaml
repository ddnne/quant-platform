logic_id: month_end_cs_fade
family_id: month_end_cs
axis: calendar
headline: true
generation_enabled: false
promote_as_main: false
go: false
thesis: >
  Invert CS momentum on the last sessions of each calendar month.
  Occupancy is month-end only; not sticky-always-on.
signal_definition: >
  last N bar sessions of each calendar month invert CS mom signs; else flat
datasets:
  - equities_bars_daily
  - markets_calendar
params:
  hold_days: 10
  momentum_n: 5
  long_frac: 0.3
  short_frac: 0.3
  n_last: 3
evaluator: research.unique_logic.cs_overlays.evaluate_month_end_cs_fade_daily_mtm
notes: catalog declaration; evaluator in packages unique_logic.cs_overlays
