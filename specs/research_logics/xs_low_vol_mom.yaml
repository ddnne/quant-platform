logic_id: xs_low_vol_mom
family_id: xs_low_vol_mom
axis: cross_section
headline: true
generation_enabled: false
promote_as_main: false
go: false
thesis: >
  When the cross-section is noisy, momentum among the quieter half is cleaner.
  Stay flat in low-vol regimes.
signal_definition: >
  high CS-vol regime then rank mom among names with vol below CS median
datasets:
  - equities_bars_daily
  - markets_calendar
params:
  hold_days: 10
  momentum_n: 5
  long_frac: 0.3
  short_frac: 0.3
  vol_lookback: 20
  min_hist: 20
evaluator: research.unique_logic.cs_overlays.evaluate_xs_low_vol_mom_daily_mtm
