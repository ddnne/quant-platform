logic_id: repo_3m_level_cs
family_id: repo_3m_level_cs
family: cs
axis: macro
headline: true
generation_enabled: false
promote_as_main: false
go: false
thesis: >
  Tight term funding (3M level) is when carry-friendly relative strength
  can be followed. Easy 3M and missing prints stay flat.
signal_definition: >
  enter iff 3M[d] >= PIT median of 3M with date < d; missing/unformed → flatten
datasets:
  - jsda_tokyo_repo_rates
  - equities_bars_daily
  - markets_calendar
params:
  hold_days: 10
  momentum_n: 5
  long_frac: 0.3
  short_frac: 0.3
  min_hist: 20
evaluator: research.unique_logic.cs_overlays.evaluate_repo_3m_level_cs_daily_mtm
