logic_id: idio_mom_macro_impulse
family_id: idio_mom_macro
family: cs
axis: macro_xs
headline: true
generation_enabled: false
promote_as_main: false
go: false
thesis: >
  Idiosyncratic relative strength is more informative on large index-move days. Rank residual momentum vs TOPIX only when the index itself has moved by at least its PIT median |mom|; stay flat on quiet macro days.
signal_definition: >
  residual = mom_n(name) − mom_n(TOPIX) on the bar calendar; enter iff abs(TOPIX_mom) >= PIT median of abs(TOPIX_mom) with date < d (min_hist=20); missing TOPIX print → flatten
datasets:
  - indices_bars_daily_topix
  - equities_bars_daily
  - markets_calendar
params:
  hold_days: 10
  momentum_n: 5
  long_frac: 0.3
  short_frac: 0.3
  min_hist: 20
  mode: idio_mom_macro_impulse
  gate: abs_topix_mom_ge_pit_median
evaluator: research.unique_logic.dispatch.evaluate_logic_daily_mtm
notes: catalog declaration; evaluate via unique_logic.dispatch
