logic_id: overnight_easy_cs_follow
family_id: overnight_level_cs
family: cs
axis: funding
headline: true
generation_enabled: false
promote_as_main: false
go: false
thesis: >
  Easy overnight funding is when relative-strength can be followed instead
  of faded. Tight overnight and missing prints stay flat.
signal_definition: >
  enter iff overnight[d] < PIT median of overnight with date < d (min_hist=20);
  tilt = +1; missing/unformed → flatten
position_rule: >
  sticky fixed_horizon CS rank mom L-S on easy-overnight days; flat otherwise
datasets:
  - jsda_tokyo_repo_rates
  - equities_bars_daily
  - markets_calendar
params:
  hold_days: 10
  momentum_n: 5
  long_frac: 0.3
  short_frac: 0.3
  min_hist: 20
  tilt: follow_easy
evaluator: research.unique_logic.cs_overlays.evaluate_overnight_level_cs_tilt_daily_mtm
notes: catalog declaration; opposite occupancy of overnight_level_cs_tilt
