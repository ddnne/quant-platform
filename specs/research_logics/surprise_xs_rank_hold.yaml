logic_id: surprise_xs_rank_hold
family_id: surprise_xs_rank
family: event
axis: mixed
headline: false
generation_enabled: false
promote_as_main: false
go: false
thesis: >
  Among names that have a PIT-available disclosure in the last H sessions, long high-surprise / short low-surprise. Relative surprise, not own-sign PEAD hold.
signal_definition: >
  CS rank of surprise among names whose PIT event entry is inside the last post_hold_days sessions; <2 names → flat (no invent)
datasets:
  - fins_summary
  - equities_bars_daily
  - markets_calendar
params:
  post_hold_days: 5
  entry_mode: same_day_close_if_pre_close
  long_frac: 0.3
  short_frac: 0.3
  mode: surprise_xs_rank
evaluator: research.unique_logic.dispatch.evaluate_logic_daily_mtm
notes: catalog declaration; evaluate via unique_logic.dispatch
